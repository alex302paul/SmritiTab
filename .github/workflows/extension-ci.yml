name: SmritiTab Live UI Preview & Compatibility Checks

on:
  push:
    branches: [main, Raw]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: smrititab-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Chrome extension and preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out OG extension (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: og

      - name: Check out wallpaper-first UI (Raw)
        uses: actions/checkout@v4
        with:
          ref: Raw
          path: raw

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            og/package-lock.json
            raw/package-lock.json

      - name: Test original extension foundation
        working-directory: og
        run: |
          npm ci
          npm test
          npm run verify

      - name: Install Raw UI dependencies
        working-directory: raw
        run: npm ci

      - name: Build Raw UI as MV3-compatible external assets
        working-directory: raw
        run: |
          cat > vite.extension.config.mjs <<'EOF'
          import path from "node:path";
          import { fileURLToPath } from "node:url";
          import tailwindcss from "@tailwindcss/vite";
          import react from "@vitejs/plugin-react";
          import { defineConfig } from "vite";

          const root = path.dirname(fileURLToPath(import.meta.url));
          export default defineConfig({
            base: "./",
            plugins: [react(), tailwindcss()],
            resolve: { alias: { "@": path.resolve(root, "src") } },
            build: {
              outDir: "dist",
              emptyOutDir: true,
              assetsDir: "assets",
              sourcemap: false,
            },
          });
          EOF
          npm run build -- --config vite.extension.config.mjs

      - name: Assemble extension using OG manifest and service worker
        run: |
          set -euo pipefail
          cp og/manifest.json raw/dist/manifest.json
          mkdir -p raw/dist/background
          cp og/background/service-worker.js raw/dist/background/service-worker.js
          node --input-type=module <<'EOF'
          import fs from "node:fs";
          import path from "node:path";
          const root = "raw/dist";
          const manifest = JSON.parse(fs.readFileSync(path.join(root, "manifest.json"), "utf8"));
          if (manifest.manifest_version !== 3) throw new Error("Expected Manifest V3");
          if (manifest.chrome_url_overrides?.newtab !== "index.html") throw new Error("New Tab override missing");
          if (!fs.existsSync(path.join(root, manifest.background.service_worker))) throw new Error("Service worker missing");
          const html = fs.readFileSync(path.join(root, "index.html"), "utf8");
          if (/<script(?![^>]*\bsrc=)[^>]*>/i.test(html)) throw new Error("Inline script blocked by MV3 CSP");
          const refs = [...html.matchAll(/(?:src|href)=["']([^"']+)["']/g)].map(m => m[1]);
          for (const ref of refs) {
            if (/^(https?:|data:|#)/i.test(ref)) continue;
            const file = path.resolve(root, ref);
            if (!file.startsWith(path.resolve(root) + path.sep) || !fs.existsSync(file)) {
              throw new Error("Missing or unsafe built asset: " + ref);
            }
          }
          console.log("MV3 package structure and local HTML assets verified.");
          EOF
          node --check raw/dist/background/service-worker.js
          test -s raw/dist/index.html
          test -s raw/dist/manifest.json

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Raw')
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload live preview
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Raw')
        uses: actions/upload-pages-artifact@v3
        with:
          path: raw/dist/

      - name: Deploy live preview
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Raw')
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Print live preview URL
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Raw')
        run: echo "Live preview deployed to ${{ steps.deployment.outputs.page_url }}"
