name: SmritiTab Integration Checks

on:
  push:
    branches:
      - integration/raw-bundle-preservation
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: smrititab-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and package integration branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test

      - name: Verify extension source
        run: npm run verify

      - name: Build installable extension directory
        run: npm run build

      - name: Verify packaged extension
        run: npm run verify:dist

      - name: Upload installable extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: smrititab-integration-extension
          path: dist/
          if-no-files-found: error
          retention-days: 14
